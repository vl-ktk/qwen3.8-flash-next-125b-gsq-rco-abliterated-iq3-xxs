name: Live Qwen Edge read-only smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/live-edge-smoke.yml

jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only live HTTPS and OAuth discovery smoke (no credentials)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const origin = 'https://qwen125b-mcp.vl-ktk.workers.dev';
          async function get(path) {
            const response = await fetch(origin + path, {
              redirect: 'manual',
              signal: AbortSignal.timeout(12000),
              headers: { accept: 'application/json' },
            });
            const body = await response.text();
            let data = null;
            try { data = JSON.parse(body); } catch { /* Keep status + content type only. */ }
            console.log(`${path}: HTTP ${response.status}; JSON ${Boolean(data)}`);
            return { response, data, body };
          }

          const status = await get('/__edge_status');
          assert.equal(status.response.status, 200, 'edge status HTTP failure');
          assert.equal(status.data?.state, 'protected', 'OAuth config is not active');

          const protectedResource = await get('/.well-known/oauth-protected-resource');
          assert.equal(protectedResource.response.status, 200);
          assert.equal(protectedResource.data?.resource, `${origin}/mcp`);
          assert.ok(protectedResource.data?.scopes_supported?.includes('qwen:update'), 'new updater scope not advertised');

          const oauth = await get('/.well-known/oauth-authorization-server');
          assert.equal(oauth.response.status, 200);
          assert.equal(oauth.data?.issuer, origin);
          assert.ok(oauth.data?.scopes_supported?.includes('qwen:update'), 'OAuth update scope missing');

          const unauthenticatedMcp = await get('/mcp');
          assert.equal(unauthenticatedMcp.response.status, 401, 'MCP must deny anonymous callers');
          assert.match(unauthenticatedMcp.response.headers.get('www-authenticate') ?? '', /Bearer/i);

          // The owner pairing page is public, but must never leak keys or
          // accept untrusted JavaScript. Inspect headers/content only; never
          // submit a pairing code, owner password or a device approval.
          const pairingPage = await get('/device/pair/manage');
          assert.equal(pairingPage.response.status, 200);
          assert.match(pairingPage.response.headers.get('content-security-policy') ?? '', /script-src 'nonce-[A-Za-z0-9_-]{32}'/);
          assert.match(pairingPage.body, /history\.replaceState\(null, "", location\.pathname\)/);
          assert.match(pairingPage.body, /Подключить компьютер к Qwen\?/);
          assert.match(pairingPage.body, /type="hidden" name="code"/);
          assert.match(pairingPage.body, /type="hidden" name="fingerprint"/);
          assert.match(pairingPage.body, /id="pair-approve" name="action" value="approve" disabled/);
          assert.doesNotMatch(pairingPage.body, /Код \(10 символов\)|Отпечаток ключа \(16 символов\)/);
          assert.doesNotMatch(pairingPage.body, /QWEN_MCP_GATEWAY_KEY|QWEN_TUNNEL_TOKEN/);

          // GitHub Actions artifacts expire; verify the permanent public
          // update asset can be fetched anonymously, bytes streamed and hashed.
          // Never submit a live update to the owner's Windows machine here.
          const release = 'https://github.com/vl-ktk/qwen3.8-flash-next-125b-gsq-rco-abliterated-iq3-xxs/releases/download/ktk-update-v0.18.8/KTK-Update-0.18.8.zip';
          const file = await fetch(release, { redirect: 'follow', signal: AbortSignal.timeout(180000) });
          assert.equal(file.status, 200, 'public release not downloadable without GitHub authentication');
          assert.ok(file.body, 'release asset missing body');
          const { createHash } = await import('node:crypto');
          const sha = createHash('sha256');
          let size = 0;
          for await (const chunk of file.body) { size += chunk.length; sha.update(chunk); }
          assert.ok(size > 60_000_000 && size < 160_000_000, 'release artifact size invalid');
          assert.equal(sha.digest('hex'), '332f769d98ff68d0c95cbadf546181f0cc2ae6424eddfa36ae05be438c0c9448');

          console.log('Live HTTPS, OAuth update scope, anonymous MCP denial, pairing page and permanent public release SHA256 PASS. Windows MCP/GPU NOT tested.');
          NODE
