name: Windows installer candidate checks

on:
  pull_request:
    paths:
      - "config/windows-package.lock.json"
      - "config/windows-mcp.defaults.json"
      - "config/KTKQwenMCP.xml"
      - "config/KTKQwenTunnel.xml"
      - "config/KTKQwenUpdater.xml"
      - "config/KTK-Setup.iss"
      - "src/windows/**"
      - "src/packaging/**"
      - "scripts/**"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Packaging unit tests (offline)
        run: node --test src/packaging/*.test.mjs
      - name: Fetch vendor binaries and verify pinned SHA-256
        run: node scripts/fetch-windows-vendors.mjs .generated/windows-vendors
      - name: Assemble verified staged installer candidate
        run: node scripts/build-windows-package.mjs .generated/windows-vendors .generated/packages/KTK-Windows-MCP-0.18.6-win-x64.zip "$SOURCE_COMMIT"
      - name: Validate archive and outer SHA-256
        run: |
          cd .generated/packages
          sha256sum --check KTK-Windows-MCP-0.18.6-win-x64.zip.sha256
          unzip -t KTK-Windows-MCP-0.18.6-win-x64.zip
          unzip -p KTK-Windows-MCP-0.18.6-win-x64.zip MANIFEST.json | node -e 'let x="";process.stdin.on("data",c=>x+=c);process.stdin.on("end",()=>{const m=JSON.parse(x);if(m.ready_for_installation!==false||m.source_commit!==process.env.SOURCE_COMMIT||m.package_version!=="0.18.6"||m.files.length<52||m.executables.length!==3)process.exit(1)})'
      - name: Save Windows staged candidate (not production-ready)
        uses: actions/upload-artifact@v4
        with:
          name: KTK-Windows-MCP-step19-${{ github.run_number }}
          path: |
            .generated/packages/KTK-Windows-MCP-0.18.6-win-x64.zip
            .generated/packages/KTK-Windows-MCP-0.18.6-win-x64.zip.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  windows-source-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Strata installer contracts on native Windows (offline mocks)
        run: node --test src/windows/strata-installer.test.mjs src/windows/sc117-model.test.mjs src/windows/sc117-inference.test.mjs src/windows/local-ai-setup.test.mjs
      - name: Parse Windows PowerShell 5.1 and service XML (no execution)
        shell: powershell
        run: |
          foreach ($file in @('scripts/Install-KTKMCP.ps1','scripts/Activate-KTKMCP.ps1','scripts/Verify-KTKPackage.ps1','scripts/Maintain-KTKMCP.ps1','scripts/Run-KTKAcceptance.ps1','scripts/Assert-KTKStaged.ps1','scripts/Show-KTKLocalAI.ps1','scripts/Run-KTKIntegratedAcceptance.ps1','scripts/Install-KTKUpdater.ps1','scripts/Run-KTKRemoteUpdate.ps1')) {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; throw 'PowerShell parser failed' }
          }
          foreach ($file in @('config/KTKQwenMCP.xml','config/KTKQwenTunnel.xml')) {
            [xml]$xml = Get-Content -LiteralPath $file -Raw
            if ($xml.service.startmode -ne 'Manual' -or $xml.service.serviceaccount.user -ne 'LocalService') { throw 'Unsafe service configuration' }
          }
          [xml]$updater = Get-Content -LiteralPath 'config/KTKQwenUpdater.xml' -Raw
          if ($updater.service.id -ne 'KTKQwenUpdater' -or $updater.service.startmode -ne 'Manual' -or $updater.service.serviceaccount.username -ne 'LocalSystem') { throw 'Unsafe updater service configuration' }
  windows-preflight:
    needs: windows-payload
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KTK-Windows-MCP-step19-${{ github.run_number }}
          path: candidate
      - name: Offline non-elevated preflight on Windows (no installation)
        shell: powershell
        run: |
          Expand-Archive -LiteralPath 'candidate/KTK-Windows-MCP-0.18.6-win-x64.zip' -DestinationPath 'candidate/extracted'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Install-KTKMCP.ps1' -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows preflight failed' }
          # Regression: WOW64 PowerShell reports PROCESSOR_ARCHITECTURE=x86 on x64 Windows.
          $wow64 = Join-Path $env:windir 'SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $wow64)) { throw 'WOW64 PowerShell not available for regression test' }
          & $wow64 -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Install-KTKMCP.ps1' -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'WOW64 OS-bitness preflight regression' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Maintain-KTKMCP.ps1' -Action Update -PackagePath 'candidate/extracted' -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows maintenance package preflight failed' }
      - name: Bundled Strata offline planning tool resolves its runtime
        shell: powershell
        run: |
          $plan = & 'candidate/extracted/bin/node.exe' 'candidate/extracted/Install-KTKStrata.mjs' --plan | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.status -ne 'planned_no_changes' -or $plan.version -ne '0.2.17') { throw 'Bundled Strata plan failed' }
      - name: Bundled SC117 offline model plan resolves its runtime
        shell: powershell
        run: |
          $plan = & 'candidate/extracted/bin/node.exe' 'candidate/extracted/Prepare-KTKSC117.mjs' --plan | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.status -ne 'planned_no_changes' -or $plan.quantization -ne 'IQ3_XXS' -or $plan.number_of_files -ne 6) { throw 'Bundled SC117 plan failed' }
      - name: Bundled SC117 offline inference plan resolves its runtime
        shell: powershell
        run: |
          $plan = & 'candidate/extracted/bin/node.exe' 'candidate/extracted/Test-KTKSC117.mjs' --plan | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.status -ne 'planned_no_changes' -or $plan.endpoint -ne 'http://127.0.0.1:18764' -or $plan.concurrency.parallel -ne 1) { throw 'Bundled SC117 inference plan failed' }
      - name: Bundled integrated setup and GUI dry checks (never install AI)
        shell: powershell
        run: |
          $plan = & 'candidate/extracted/bin/node.exe' 'candidate/extracted/Install-KTKLocalAI.mjs' --plan | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.status -ne 'planned_no_changes' -or $plan.phases.Count -ne 5) { throw 'Integrated setup plan failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Show-KTKLocalAI.ps1' -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Integrated GUI dry check failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Install-KTKUpdater.ps1' -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Bundled remote updater dry check failed' }
  windows-real-scm-offline:
    needs: windows-payload
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KTK-Windows-MCP-step19-${{ github.run_number }}
          path: candidate
      - name: Fully isolated hosted-runner installation, ACL, service and cleanup smoke
        shell: powershell
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Requires GitHub-hosted ephemeral Windows' }
          Expand-Archive -LiteralPath 'candidate/KTK-Windows-MCP-0.18.6-win-x64.zip' -DestinationPath 'candidate/extracted'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Run-KTKAcceptance.ps1' -Offline
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows SCM/ACL acceptance failed' }
          if ((Get-Service KTKQwenMCP,KTKQwenTunnel -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Test services survived cleanup' }
  windows-updater-scm-offline:
    needs: windows-payload
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KTK-Windows-MCP-step19-${{ github.run_number }}
          path: candidate
      - name: Isolated LocalSystem updater bootstrap, HMAC status and cleanup
        shell: powershell
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Requires GitHub-hosted ephemeral Windows' }
          Expand-Archive -LiteralPath 'candidate/KTK-Windows-MCP-0.18.6-win-x64.zip' -DestinationPath 'candidate/extracted'
          $gateway = Join-Path $env:ProgramData 'KTK\QwenMCP\secrets\gateway.key'
          $root = Join-Path $env:ProgramFiles 'KTK\Updater'
          $data = Join-Path $env:ProgramData 'KTK\Updater'
          if ((Test-Path -LiteralPath $gateway) -or (Test-Path -LiteralPath $root) -or (Get-Service KTKQwenUpdater -ErrorAction SilentlyContinue)) { throw 'Unexpected non-isolated runner' }
          try {
            New-Item -ItemType Directory -Path (Split-Path -Parent $gateway) -Force | Out-Null
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $key = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
            [IO.File]::WriteAllText($gateway, $key)
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'candidate/extracted/Install-KTKUpdater.ps1' -Live
            if ($LASTEXITCODE -ne 0) { throw 'LocalSystem updater bootstrap failed' }
            $service = Get-CimInstance Win32_Service -Filter "Name='KTKQwenUpdater'"
            if (-not $service -or $service.StartName -ne 'LocalSystem' -or $service.State -ne 'Running') { throw 'Updater service not running as SYSTEM' }
            $script = 'import {readFile} from "node:fs/promises"; const {callLocalUpdater} = await import("./candidate/extracted/runtime/remote-update.mjs"); const key = (await readFile(process.env.TEST_GATEWAY, "utf8")).trim(); const result = await callLocalUpdater("status", null, {keyText:key}); if(result.status!=="idle") process.exit(1);'
            $env:TEST_GATEWAY = $gateway
            for ($i=0; $i -lt 10; $i++) {
              & 'candidate/extracted/bin/node.exe' --input-type=module -e $script
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($LASTEXITCODE -ne 0) { throw 'Updater loopback HMAC health check failed' }
          } finally {
            if (Get-Service KTKQwenUpdater -ErrorAction SilentlyContinue) {
              Stop-Service KTKQwenUpdater -ErrorAction SilentlyContinue
              & (Join-Path $root 'KTKQwenUpdater.exe') uninstall | Out-Null
            }
            foreach ($target in @($root,$data,(Join-Path $env:ProgramData 'KTK\QwenMCP'))) {
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }
  windows-setup-exe:
    needs: windows-payload
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KTK-Windows-MCP-step19-${{ github.run_number }}
          path: candidate
      - name: Build single-file test Setup.exe from verified ZIP
        shell: powershell
        run: |
          Expand-Archive -LiteralPath 'candidate/KTK-Windows-MCP-0.18.6-win-x64.zip' -DestinationPath 'candidate/extracted'
          $compiler = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { choco install innosetup --no-progress -y; $compiler = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          New-Item -ItemType Directory -Path 'candidate/setup' -Force | Out-Null
          $src = (Resolve-Path 'candidate/extracted').Path
          $dst = (Resolve-Path 'candidate/setup').Path
          & $compiler "/DSourceRoot=$src" "/DOutputRoot=$dst" 'config/KTK-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Setup.exe compilation failed' }
          $exe = Join-Path $dst 'KTK-Qwen-MCP-Setup-0.18.6-TEST-UNSIGNED.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Setup.exe not generated' }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($exe) | Set-Content -Path ($exe + '.sha256')
          & $exe '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART' '/OFFLINE'
          if ($LASTEXITCODE -ne 0) { throw 'One-click Setup.exe offline lifecycle failed' }
          if ((Get-Service KTKQwenMCP,KTKQwenTunnel -ErrorAction SilentlyContinue).Count -gt 0) { throw 'One-click Setup left test services behind' }
      - name: Upload standalone unsigned acceptance EXE (not production-ready)
        uses: actions/upload-artifact@v4
        with:
          name: KTK-MCP-Setup-step19-${{ github.run_number }}
          path: |
            candidate/setup/KTK-Qwen-MCP-Setup-0.18.6-TEST-UNSIGNED.exe
            candidate/setup/KTK-Qwen-MCP-Setup-0.18.6-TEST-UNSIGNED.exe.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
